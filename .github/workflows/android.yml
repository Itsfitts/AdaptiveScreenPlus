name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Assemble Release APK
      run: ./gradlew assembleRelease

    - name: Find APK
      id: find_apk
      run: |
        set -e
        echo "Searching for APK..."
        APK_PATH=$(find . -type f -name "*.apk" -print | head -n 1 || true)
        if [ -z "$APK_PATH" ]; then
          echo "No APK found" >&2
          exit 1
        fi
        echo "Found $APK_PATH"
        echo "apk=$APK_PATH" >> $GITHUB_OUTPUT

    - name: Create GitHub prerelease and upload APK
      uses: ncipollo/release-action@v1
      with:
        tag: v${{ github.run_number }}
        name: "CI build v${{ github.run_number }}"
        body: "Automated CI build — prerelease"
        draft: false
        prerelease: true
        files: ${{ steps.find_apk.outputs.apk }}
